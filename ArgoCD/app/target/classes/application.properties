server.port=8080
spring.application.name=shop-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopdb}
spring.datasource.username=${DB_USER:shopuser}
spring.datasource.password=${DB_PASSWORD:shoppassword}
spring.sql.init.mode=always

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
