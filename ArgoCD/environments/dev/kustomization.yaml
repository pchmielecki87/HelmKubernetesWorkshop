apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-dev

resources:
  - ../../base

# Modyfikacja obrazu na potrzeby środowiska DEV
images:
  - name: shop-backend
    newName: twój-dockerhub/shop-backend
    newTag: dev-latest

# Zwiększenie liczby replik na środowisku DEV
patches:
  - target:
      kind: Deployment
      name: shop-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
