apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: shop-prod  # commented because application set complains that the namespace is not created

resources:
  - ../../base

images:
  - name: shop-backend
    newName: ghcr.io/pchmielecki87/shop-backend
    newTag: dev # temporary solution as we do have now only one image

patches:
  - target:
      kind: Deployment
      name: shop-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
