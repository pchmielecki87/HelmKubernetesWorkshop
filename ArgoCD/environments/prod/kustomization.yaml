apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-prod

resources:
  - ../../base

images:
  - name: shop-backend
    newName: twój-dockerhub/shop-backend
    newTag: v1.0.0

patches:
  - target:
      kind: Deployment
      name: shop-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
