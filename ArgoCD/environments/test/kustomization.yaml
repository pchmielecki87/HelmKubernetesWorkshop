apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-test

resources:
  - ../../base

# Proper image located in GitHub Container Registry
images:
  - name: shop-backend
    newName: ghcr.io/pchmielecki87/shop-backend
    newTag: test

# Increase number of replicas in TEST environment
patches:
  - target:
      kind: Deployment
      name: shop-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
